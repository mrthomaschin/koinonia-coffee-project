steps:
  # Install dependencies with npm install instead of npm ci
  - name: 'node:24'
    entrypoint: 'npm'
    args: ['install', '--include=optional', '--legacy-peer-deps']
    dir: 'functions'
  
  # Build the functions
  - name: 'node:24'
    entrypoint: 'npm'
    args: ['run', 'build']
    dir: 'functions'
